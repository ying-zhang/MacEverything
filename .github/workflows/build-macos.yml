name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install re2

      - name: Build release app
        run: |
          xcodebuild \
            -project MacEverything.xcodeproj \
            -scheme MacEverything \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            SYMROOT="$PWD/build" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify dynamic libraries are bundled
        run: |
          app="$PWD/build/Release/MacEverything.app"
          main="$app/Contents/MacOS/MacEverything"

          echo "MacEverything dependencies:"
          otool -L "$main"

          if otool -L "$main" | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::App binary still references Homebrew dylibs"
            exit 1
          fi

          if ! find "$app/Contents/Frameworks" -name 'libre2*.dylib' -print -quit | grep -q .; then
            echo "::error::libre2 dylib was not embedded in the app bundle"
            exit 1
          fi

          while IFS= read -r dylib; do
            echo "Checking $dylib"
            if otool -L "$dylib" | grep -E '/opt/homebrew|/usr/local'; then
              echo "::error::$dylib still references Homebrew dylibs"
              exit 1
            fi
          done < <(find "$app/Contents/Frameworks" -name '*.dylib' -print)

      - name: Create DMG
        run: |
          scripts/create-dmg.sh build/Release/MacEverything.app MacEverything.dmg MacEverything

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacEverything-macOS
          path: |
            build/Release/MacEverything.app
            MacEverything.dmg
