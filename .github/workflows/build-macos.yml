name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

jobs:
  build-arm64:
    if: github.event_name != 'schedule'
    name: Build arm64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: brew install re2 abseil

      - name: Prepare local RE2 dependencies
        run: scripts/prepare-re2-deps.sh third_party/re2

      - name: Run fast tests
        run: make test-fast

      - name: Build release DMG
        run: scripts/build-release-dmgs.sh arm64

      - name: Run MCP protocol tests against built binary
        env:
          MACE_MCP_BINARY: build/arm64/Release/MacEverythingMCP
        run: ./test_all --part 49 --quiet

      - name: Verify DMG exists
        run: |
          dmg="artifacts/MacEverything-arm64.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "::error::DMG was not created: $dmg"
            exit 1
          fi
          ls -lh "$dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MacEverything-macOS-arm64
          path: |
            build/arm64/Release/MacEverything.app
            artifacts/MacEverything-arm64.dmg

  build-intel:
    if: github.event_name != 'schedule'
    name: Build x86_64
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: brew install re2 abseil

      - name: Prepare local RE2 dependencies
        run: scripts/prepare-re2-deps.sh third_party/re2

      - name: Run fast tests
        run: make test-fast

      - name: Build release DMG
        run: scripts/build-release-dmgs.sh x86_64

      - name: Verify DMG exists
        run: |
          dmg="artifacts/MacEverything-x86_64.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "::error::DMG was not created: $dmg"
            exit 1
          fi
          ls -lh "$dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MacEverything-macOS-x86_64
          path: |
            build/x86_64/Release/MacEverything.app
            artifacts/MacEverything-x86_64.dmg

  address-sanitizer:
    if: github.event_name == 'schedule'
    name: Weekly AddressSanitizer
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install dependencies
        run: brew install re2 abseil
      - name: Prepare local RE2 dependencies
        run: scripts/prepare-re2-deps.sh third_party/re2
      - name: Run fast tests with AddressSanitizer
        run: make test-asan

  thread-sanitizer:
    if: github.event_name == 'schedule'
    name: Weekly ThreadSanitizer
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install dependencies
        run: brew install re2 abseil
      - name: Prepare local RE2 dependencies
        run: scripts/prepare-re2-deps.sh third_party/re2
      - name: Run fast tests with ThreadSanitizer
        run: make test-tsan

  full-core-tests:
    if: github.event_name == 'schedule'
    name: Weekly full core tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install dependencies
        run: brew install re2 abseil
      - name: Prepare local RE2 dependencies
        run: scripts/prepare-re2-deps.sh third_party/re2
      - name: Build MCP protocol test binary
        run: >-
          xcodebuild -project MacEverything.xcodeproj -target MacEverythingMCP
          -configuration Release
          CONFIGURATION_BUILD_DIR="$PWD/build/arm64/Release" build
      - name: Run full core suite
        env:
          MACE_MCP_BINARY: build/arm64/Release/MacEverythingMCP
        run: make test-all
