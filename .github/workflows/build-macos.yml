name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-intel:
    name: Build x86_64
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: brew install re2 abseil

      - name: Run fast tests
        run: make test-fast

      - name: Build release DMG
        run: scripts/build-release-dmgs.sh x86_64

      - name: Verify DMG exists
        run: |
          dmg="artifacts/MacEverything-x86_64.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "::error::DMG was not created: $dmg"
            exit 1
          fi
          ls -lh "$dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MacEverything-macOS-x86_64
          path: |
            build/x86_64/Release/MacEverything.app
            artifacts/MacEverything-x86_64.dmg
